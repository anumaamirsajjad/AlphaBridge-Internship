name: deploy-api

on:
  # Pushes to develop run the tests. Pushes to main run the deploy.
  push:
    branches: [develop, main]
  # Pull requests into develop run the tests and the Terraform check.
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: alphabridge-api
  TERRAFORM_VERSION: "1.16.6"

jobs:
  # Runs the unit tests on develop and on pull requests into develop. Nothing is deployed from here.
  test:
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        working-directory: api
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        working-directory: api
        run: pytest

  # Checks the Terraform files without touching AWS: formatting, then the configuration itself.
  check-terraform:
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Validate the configuration
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform validate

  # Runs only on a push to main, after code has been reviewed and tested on develop.
  # It builds the image, applies Terraform with the new image tag, and the auto scaling
  # group replaces the servers one at a time.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Logs in to AWS with a short-lived role, which only a push to main can use.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tags each image with the commit ID, so every deploy is traceable.
      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        working-directory: api
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # Terraform changes the server recipe to the new image. The auto scaling group then
      # replaces the servers one at a time, with the load balancer draining each one.
      - name: Apply infrastructure with the new image
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve -input=false -var "image_tag=${{ github.sha }}"
