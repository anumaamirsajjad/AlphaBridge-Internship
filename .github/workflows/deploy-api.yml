name: deploy-api

on:
  # Pushes to develop run the tests. Pushes to main run the deploy.
  push:
    branches: [develop, main]
  # Pull requests into develop run the tests. Feature branches are not tested on push.
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: alphabridge-api
  LAUNCH_TEMPLATE: alphabridge-app-lt
  AUTO_SCALING_GROUP: alphabridge-asg

jobs:
  # Runs the unit tests on develop and on pull requests into develop. Nothing is deployed from here.
  test:
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        working-directory: api
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        working-directory: api
        run: pytest

  # Builds the image, points the launch template at it, and replaces the servers one at a time.
  # Code reaches main only through develop, where the tests already ran, so this job does not wait for them.
  #
  # The deploy role needs these permissions besides ECR: ec2:DescribeLaunchTemplateVersions,
  # ec2:CreateLaunchTemplateVersion, autoscaling:StartInstanceRefresh,
  # autoscaling:DescribeInstanceRefreshes, and iam:PassRole for alphabridge-app-ec2.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Logs in to AWS with a short-lived role. No access keys are stored in GitHub.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tags each image with the commit ID, so every deploy is traceable.
      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        working-directory: api
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Writes a new launch template version that starts this commit's image.
      # The current template is copied, and only its startup script changes.
      - name: Create launch template version for this image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          cat > user-data.sh <<EOF
          #!/bin/bash
          dnf install -y docker
          systemctl enable --now docker
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY
          DATABASE_URL=\$(aws secretsmanager get-secret-value --region $AWS_REGION --secret-id alphabridge/database-url --query SecretString --output text)
          docker run -d --name alphabridge-api --restart unless-stopped -p 8000:8000 --log-driver=awslogs --log-opt awslogs-region=$AWS_REGION --log-opt awslogs-group=/alphabridge/app --log-opt awslogs-stream=api -e DATABASE_URL="\$DATABASE_URL" -e PGSSLMODE=require $IMAGE
          EOF
          aws ec2 describe-launch-template-versions --launch-template-name "$LAUNCH_TEMPLATE" --versions '$Latest' \
            --query 'LaunchTemplateVersions[0].LaunchTemplateData' > current.json
          jq --arg ud "$(base64 -w0 user-data.sh)" '.UserData = $ud' current.json > new.json
          aws ec2 create-launch-template-version --launch-template-name "$LAUNCH_TEMPLATE" \
            --version-description "$GITHUB_SHA" --launch-template-data file://new.json

      # Replaces the servers one at a time. At least half stay in service during the refresh,
      # and the load balancer drains each old server before it is removed.
      - name: Start instance refresh
        run: |
          aws autoscaling start-instance-refresh --auto-scaling-group-name "$AUTO_SCALING_GROUP" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 120}'

      - name: Wait for the refresh to finish
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$AUTO_SCALING_GROUP" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "Refresh status: $STATUS"
            case "$STATUS" in
              Successful) exit 0 ;;
              Failed|Cancelled) exit 1 ;;
            esac
            sleep 30
          done
          exit 1
