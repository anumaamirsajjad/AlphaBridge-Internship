# Line-by-line notes: lines starting with # or ; are comments. pytest ignores them.
# What this file does:
#   Settings for pytest, the test runner. Run the tests with: python -m pytest
#   Tells pytest where the tests are and how to find the application code.

# Section header. pytest only reads settings listed under this header.
[pytest]
# Where pytest should look for test files: the tests folder only.
testpaths = tests
# Adds the api folder to Python's import path, so "import main" and "import banking" work.
# "." means the current folder (api).
pythonpath = .
